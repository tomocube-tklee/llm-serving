services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    restart: unless-stopped
    ports:
      # Bind only to the Tailscale interface so the API is reachable
      # over the tailnet but NOT exposed on the LAN or public internet.
      - "100.117.22.53:8080:8080"
    volumes:
      # Persist downloaded GGUF models here so they aren't re-downloaded.
      - ./models:/models
    environment:
      - LLAMA_CACHE=/models
    # --no-mmproj: 이 모델은 비전-언어 모델이라 mmproj 가 딸려오는데 봇은 이미지를
    #   넣지 않는다. 빼면 VRAM 이 준다.
    # --reasoning off: thinking 은 이 모델의 기본값이 ON 이다. 켜두면 분류기
    #   페이로드의 max_tokens(5) 를 추론 토큰이 다 써서 content 가 빈 문자열로 오고
    #   (finish_reason=length) 전 분류기가 조용히 폴백한다. 요약 품질 이득은 judge
    #   평균 7.4 → 7.7 로 작았고, 켜려면 max_tokens 와 타임아웃을 코드에서 함께
    #   올려야 한다.
    # UD-Q6_K_XL + KV q4_0: Q5_K_M 대비 KLD 0.0198 → 0.0123 (Q8_0/f16 기준, wikitext
    #   3.3만 토큰). KV 를 q8_0 으로 올리면 KLD 0.0063 이지만 262k 에서 33.5GB 라
    #   32GB GPU 에 안 들어가고, 컨텍스트를 줄이면 실측 최대 요청(23.3만 토큰)이 잘린다.
    #   현재 구성은 262k 에서 29.4GB.
    # 주의: 아래는 YAML folded 블록이라 '#' 가 주석이 아니라 명령 문자열이 된다.
    command: >
      -hf unsloth/Qwen3.8-27B-GGUF:UD-Q6_K_XL
      --host 0.0.0.0 --port 8080
      -ngl 99
      -c 262144
      -np 1
      -fa on
      --jinja
      --cache-type-k q4_0 --cache-type-v q4_0
      --api-key-file /models/api-keys.txt
      --metrics
      --verbose
      -a qwen3.8
      --no-mmproj
      --reasoning off
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional request/response logger. Point opencode at :8090 (instead of :8080)
  # when you want full prompt+response capture; :8080 stays direct/undisturbed.
  llm-logproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: llm-logproxy
    restart: unless-stopped
    ports:
      - "100.117.22.53:8090:8090"
    volumes:
      - ./proxy-logs:/logs
      - ./proxy/log_addon.py:/addon.py:ro
    command: >
      mitmdump
      --mode reverse:http://llama:8080
      --listen-host 0.0.0.0 --listen-port 8090
      -s /addon.py
      --set stream_large_bodies=100m
    depends_on:
      - llama

  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    container_name: gpu-exporter
    restart: unless-stopped
    expose:
      - "9835"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "100.117.22.53:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "100.117.22.53:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # 값은 이 디렉토리의 .env 에 있다(git 미추적). 미설정이면 compose 가 즉시
      # 실패한다 — 기본값으로 조용히 되돌아가지 않게 하기 위함.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set in .env}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
