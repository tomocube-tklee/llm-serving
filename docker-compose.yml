services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    restart: unless-stopped
    ports:
      # Bind only to the Tailscale interface so the API is reachable
      # over the tailnet but NOT exposed on the LAN or public internet.
      - "100.117.22.53:8080:8080"
    volumes:
      # Persist downloaded GGUF models here so they aren't re-downloaded.
      - ./models:/models
    environment:
      - LLAMA_CACHE=/models
    command: >
      -hf unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF:Q5_K_M
      --host 0.0.0.0 --port 8080
      -ngl 99
      -c 262144
      -np 1
      -fa on
      --jinja
      --cache-type-k q4_0 --cache-type-v q4_0
      --api-key-file /models/api-keys.txt
      --metrics
      --verbose
      -a qwen3-instruct
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional request/response logger. Point opencode at :8090 (instead of :8080)
  # when you want full prompt+response capture; :8080 stays direct/undisturbed.
  llm-logproxy:
    image: mitmproxy/mitmproxy:latest
    container_name: llm-logproxy
    restart: unless-stopped
    ports:
      - "100.117.22.53:8090:8090"
    volumes:
      - ./proxy-logs:/logs
      - ./proxy/log_addon.py:/addon.py:ro
    command: >
      mitmdump
      --mode reverse:http://llama:8080
      --listen-host 0.0.0.0 --listen-port 8090
      -s /addon.py
      --set stream_large_bodies=100m
    depends_on:
      - llama

  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.3.2
    container_name: gpu-exporter
    restart: unless-stopped
    expose:
      - "9835"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "100.117.22.53:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "100.117.22.53:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # 값은 이 디렉토리의 .env 에 있다(git 미추적). 미설정이면 compose 가 즉시
      # 실패한다 — 기본값으로 조용히 되돌아가지 않게 하기 위함.
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set in .env}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
